<!doctype html>
{% load static %}
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base-url" content="{{ request.scheme }}://{{ request.get_host }}"><title>Sign in — Vordi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'styles.css' %}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/">vordi<span>•</span></a><p class="eyebrow">Welcome back</p><h1>Pick up where you left off.</h1><form id="signinForm"><label>Username<input id="username" required autocomplete="username" placeholder="Your username"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="primary-button">Sign in</button><p class="form-message" id="formMessage"></p></form><p class="auth-switch">New here? <a href="/signup.html">Create an account</a></p></main><script src="{% static 'config.js' %}"></script><script src="{% static 'app.js' %}"></script></body></html>
