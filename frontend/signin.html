<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Sign in — Pulse</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account</p>
      <form id="form-signin" aria-describedby="signin-help">
        <div class="form-group">
          <label for="signin-username">Username or email</label>
          <input id="signin-username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input id="signin-password" name="password" type="password" required autocomplete="current-password">
        </div>
        <div class="form-row">
          <button class="btn-primary" type="submit">Sign in</button>
          <a href="signup.html" class="btn-link">Create account</a>
        </div>
        <div id="signin-feedback" class="feedback" role="alert" aria-live="assertive"></div>
      </form>
    </div>
  </main>

  <!-- Bottom Tab Bar (Mobile) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html" class="bottom-nav-item" data-nav="home" id="bottom-nav-home" aria-label="Home">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="#" class="bottom-nav-item" data-nav="search" id="bottom-nav-search" aria-label="Search">
      <span class="nav-icon">🔍</span>
      <span>Search</span>
    </a>
    <a href="messages.html" class="bottom-nav-item" data-nav="messages" id="bottom-nav-messages" aria-label="Messages">
      <span class="nav-icon">💬</span>
      <span>Messages</span>
      <span class="bottom-nav-badge" id="nav-messages-badge" style="display:none">0</span>
    </a>
    <a href="#" class="bottom-nav-item" data-nav="notifications" id="bottom-nav-notifications" aria-label="Notifications">
      <span class="nav-icon">🔔</span>
      <span>Alerts</span>
      <span class="bottom-nav-badge" id="nav-notifications-badge" style="display:none">0</span>
    </a>
    <a href="#" class="bottom-nav-item" data-nav="profile" id="bottom-nav-profile" aria-label="Profile">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </a>
  </nav>
  <script src="/static/app.js" defer></script>
</body>
</html>
