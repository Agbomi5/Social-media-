<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Sign up — Pulse</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260909">
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Join Pulse and start sharing</p>
      <form id="form-signup" aria-describedby="signup-help">
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input id="signup-username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-row">
          <button class="btn-primary" type="submit">Create account</button>
          <a href="signin.html" class="btn-link">Sign in</a>
        </div>
        <div id="signup-feedback" class="feedback" role="alert" aria-live="assertive"></div>
      </form>
    </div>
  </main>

  <!-- Bottom Tab Bar (Mobile) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button type="button" class="bottom-nav-item" data-nav="home" id="bottom-nav-home" aria-label="Home">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </button>
    <button type="button" class="bottom-nav-item" data-nav="search" id="bottom-nav-search" aria-label="Search">
      <span class="nav-icon">🔍</span>
      <span>Search</span>
    </button>
    <button type="button" class="bottom-nav-item" data-nav="messages" id="bottom-nav-messages" aria-label="Messages">
      <span class="nav-icon">💬</span>
      <span>Messages</span>
      <span class="bottom-nav-badge" id="nav-messages-badge" style="display:none">0</span>
    </button>
    <button type="button" class="bottom-nav-item" data-nav="notifications" id="bottom-nav-notifications" aria-label="Notifications">
      <span class="nav-icon">🔔</span>
      <span>Alerts</span>
      <span class="bottom-nav-badge" id="nav-notifications-badge" style="display:none">0</span>
    </button>
    <button type="button" class="bottom-nav-item" data-nav="profile" id="bottom-nav-profile" aria-label="Profile">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>
  </nav>
  <script src="/static/app.js" defer></script>
</body>
</html>
