<!doctype html>
{% load static %}
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base-url" content="{{ request.scheme }}://{{ request.get_host }}"><title>Join Vordi</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'styles.css' %}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="/">vordi<span>•</span></a><p class="eyebrow">A place for your people</p><h1>Start sharing beautifully.</h1><form id="signupForm"><label>Username<input id="username" required minlength="3" autocomplete="username" placeholder="Choose a username"></label><label>Email<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><label>Confirm password<input id="confirmPassword" type="password" required autocomplete="new-password" placeholder="Repeat your password"></label><button class="primary-button">Create my account</button><p class="form-message" id="formMessage"></p></form><p class="auth-switch">Already have an account? <a href="/signin.html">Sign in</a></p></main><script src="{% static 'config.js' %}"></script><script src="{% static 'app.js' %}"></script></body></html>
